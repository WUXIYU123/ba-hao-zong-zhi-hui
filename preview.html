<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>八号总指挥：公关大逃亡 · 浏览器试玩</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; background: #201b2b; font-family: Arial, sans-serif; }
    body { display: grid; place-items: center; padding: 18px; box-sizing: border-box; }
    #shell { width: min(92vw, 390px); }
    #bar { color: #fff7e8; font-size: 14px; margin: 0 0 10px 2px; opacity: .84; }
    #stage { width: 100%; aspect-ratio: 750 / 1334; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 50px rgba(0,0,0,.35); background: #fff7e8; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="bar">浏览器试玩版 · 霓虹公关海报风 · 左右滑动换道</div>
    <div id="stage"><canvas id="gameCanvas"></canvas></div>
  </div>
  <script>
    window.onerror = (message, source, line, column) => { document.getElementById('bar').textContent = `试玩错误：${message}（第${line}行）`; };
    const htmlCanvas = document.getElementById('gameCanvas');
    const touchStart = [];
    const touchMove = [];
    window.wx = {
      createCanvas: () => htmlCanvas,
      getSystemInfoSync: () => ({ pixelRatio: 1, windowWidth: 750, windowHeight: 1334 }),
      getStorageSync: key => Number(localStorage.getItem(key) || 0),
      setStorageSync: (key, value) => localStorage.setItem(key, String(value)),
      onTouchStart: fn => touchStart.push(fn),
      onTouchMove: fn => touchMove.push(fn),
    };
    const point = e => {
      const r = htmlCanvas.getBoundingClientRect();
      return { clientX: (e.clientX - r.left) * 750 / r.width, clientY: (e.clientY - r.top) * 1334 / r.height };
    };
    htmlCanvas.addEventListener('pointerdown', e => { htmlCanvas.setPointerCapture?.(e.pointerId); const t = point(e); touchStart.forEach(fn => fn({ touches: [t] })); });
    htmlCanvas.addEventListener('pointermove', e => { if (e.buttons === 0) return; const t = point(e); touchMove.forEach(fn => fn({ touches: [t] })); });
  </script>
  <script src="game.js"></script>
</body>
</html>
